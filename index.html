<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-app">

        <h1>🌤️ Weather App</h1>
        <p class="subtitle">Cek cuaca berdasarkan nama kota</p>

        <!-- Form pencarian -->
        <form id="searchForm">

            <input
                type="text"
                id="cityInput"
                placeholder="Masukkan nama kota..."
                autocomplete="off"
            >

            <button type="submit">
                Cari
            </button>

        </form>

        <!-- Loading -->
        <div id="loading" class="hidden">
            ⏳ Memuat data...
        </div>

        <!-- Error -->
        <div id="error" class="hidden"></div>

        <!-- Hasil cuaca -->
        <div id="weatherResult" class="hidden">

            <h2 id="cityName"></h2>

            <img
                id="weatherIcon"
                src=""
                alt="Ikon cuaca"
            >

            <p id="temperature" class="temperature"></p>

            <p id="description"></p>

            <div class="info">

                <div>
                    <span>💧 Kelembaban</span>
                    <strong id="humidity"></strong>
                </div>

                <div>
                    <span>💨 Kecepatan Angin</span>
                    <strong id="wind"></strong>
                </div>

            </div>

        </div>

        <!-- Riwayat pencarian -->
        <div class="history">

            <h3>Riwayat Pencarian</h3>

            <ul id="historyList"></ul>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
